<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharkie</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/startScreen.css">
    <link rel="stylesheet" href="css/options-page.css">
    <link rel="icon" type="image/x-icon" href="./img/1.Sharkie/1.IDLE/1.png"/>

    <script src="models/world.class.js"></script>
    <script src="models/drawable-object.class.js"></script>
    <script src="models/statusBar.class.js"></script>
    <script src="models/poison-statusBar.class.js"></script>
    <script src="models/health-statusBar.class.js"></script>
    <script src="models/coin-statusBar.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/collectable-objekt.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/poison-water.class.js"></script>
    <script src="models/poison-ground.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/pufferfish.class.js"></script>
    <script src="models/jellyfish.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
    <script src="js/menu.js" defer></script>
</head>
<body onload="init()">

    <canvas id="canvas" class="d_none" width="720" height="480"></canvas>

    <div class="startScreen" id="startScreen">
        <div class="background"></div>

        <div class="content">
            <h1 class="title">Sharkie</h1>
            <p class="subtitle">Begib dich mit Sharkie auf ein Abenteuer durch die Tiefen des Ozeans!</p>

            <div class="menu">
                <button class="btn btn-start" id="start-btn">Start Game</button>
                <button class="btn btn-options">Options</button>
            </div>

            <div class="bottom-menu">
                <button class="btn btn-small btn-credits">Credits</button>
                <button class="btn btn-small btn-privacy">Privacy Policy</button>
            </div>

            <div class="shark" id="shark"></div>
        </div>
    </div>

    <dialog class="dialogOptions" id="optionsMenu">
        <header>
            <h2>OPTIONS</h2>
        </header>

        <section class="options-section">
            <div class="volume-controls">
                <label for="musicVolume">🎵 Musiklautstärke</label>
                <input type="range" id="musicVolume" min="0" max="100" value="70">
                
                <label for="effectVolume">🔊 Effektlautstärke</label>
                <input type="range" id="effectVolume" min="0" max="100" value="80">
            </div>

            <div class="controls-info">
                <h3>🎮 Steuerung</h3>
                <ul>
                    <li>⬆️ / ⬇️ / ⬅️ / ➡️ – Bewegung</li>
                    <li>🅳 – Spezialangriff</li>
                    <li>⎵ (Leertaste) – Finnen-Schlag</li>
                </ul>
            </div>
        </section>

        <footer>
            <button class="btn btn-small" id="closeOptions">Zurück</button>
        </footer>
</dialog>




</body>
</html>
